# Tray title.
title = 'LibreLinkUp'
# Blood sugar unit. (one of: mg/dL, mmol/L)
units = 'mg/dL'

# LibreLinkUp account settings.
[librelinkup]
# LibreLinkUp email address. (required)
username = ''
# LibreLinkUp password. (required)
password = ''
# LibreLinkUp region. (one of: ae, ap, au, ca, de, eu, eu2, fr, jp, us, la, ru, cn)
# If left blank, the region will be detected automatically.
region = ''
# Patient ID of the connection to follow. If left blank, the first connection will be used.
patient-id = ''

# Disable parts of the menu bar text. Only supported on macOS and Linux.
[last-reading]
# Readings older than this duration will be displayed as stale (strikethrough).
stale-threshold = '15m'
hide-arrow = false
hide-delta = false
hide-time-ago = false

# Makes the tray icon show the current blood sugar reading.
[dynamic-icon]
enabled = false
# Hex code used to render text.
font-color = '#fff'
# Font path or filename of a system font. If left blank, an embedded font will be used.
font-file = ''
# Maximum font size in points.
max-font-size = 40.0

# Customize the arrows.
[arrows]
double-up = '⇈'
single-up = '↑'
forty-five-up = '↗'
flat = '→'
forty-five-down = '↘'
single-down = '↓'
double-down = '⇊'
unknown = '-'

# Exposes the latest reading to other applications over a local socket.
[socket]
enabled = false
# Local file format. (one of: csv)
format = 'csv'
# File path. $TMPDIR will be replaced with the current temp directory.
path = '$TMPDIR/nightscout.sock'

# Log configuration
[log]
# Values: trace, debug, info, warn, error, fatal, panic
level = 'info'
# Values: auto, color, plain, json
format = 'auto'

# Advanced settings.
[advanced]
# How often to fetch new readings from LibreLinkUp.
interval = '2m'
# LibreLinkUp app version sent to the API.
# Only change this if LibreLinkUp starts rejecting requests with a version error.
api-version = '4.16.0'
# If enabled, the reading's age will be rounded up to the nearest minute.
round-age = true
